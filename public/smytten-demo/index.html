<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OBSA × Smytten Demo</title>
<meta name="description" content="Clickable demo of OBSA's social layer inside the Smytten app. All data is mock data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF6F1; --ink:#1E1E24; --muted:#6B6B73; --orange:#F24E23; --navy:#111827;
  --yellow:#FDB515; --teal:#17A2B0; --teal-ink:#0E7C87; --tint:#FDE8E1; --line:#E8E2DA;
  --white:#fff; --grey:#EEEAE4; --grey-ink:#5A5A62; --orange-ink:#D63E15;
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fast:220ms; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal-ink);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Top bar ---------- */
.topbar{height:64px;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--cream)}
.lockup{display:flex;align-items:center;gap:10px;flex:none}
.wordmark{font-weight:700;font-size:26px;letter-spacing:-.5px;color:var(--ink)}
.lockup .x{color:#9a9aa2;font-size:16px}
.smy-circle{width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:10.5px;letter-spacing:.2px}
.smy-circle.sm{width:34px;height:34px;font-size:7px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:4px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:0 14px;min-height:38px;border-radius:3px;font-weight:500;color:var(--muted);transition:background var(--fast),color var(--fast)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.topbar .seg{margin-left:auto}
.topbar .tag{font-size:12px;color:var(--muted)}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 64px - 8px);height:calc(100dvh - 64px - 8px)}
.stage{overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px}
.footer-bar{position:fixed;left:0;right:0;bottom:0;height:8px;display:grid;grid-template-columns:1fr 1fr 1fr;z-index:60}
.footer-bar span:nth-child(1){background:var(--orange)}.footer-bar span:nth-child(2){background:var(--yellow)}.footer-bar span:nth-child(3){background:var(--teal)}

/* ---------- Deck typography ---------- */
.label{font-size:11px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--teal-ink);margin:0 0 4px}
.title{font-weight:700;font-size:22px;line-height:1.2;margin:0;color:var(--ink)}
.title em{font-style:normal;color:var(--orange)}
.bar{width:60px;height:5px;background:var(--teal);margin:10px 0 16px}
.h3{font-weight:700;font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.caption{font-style:italic;font-size:11.5px;color:var(--muted);margin:14px 0 4px}

/* ---------- Cards ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:4px;border-left:4px solid var(--orange);padding:14px;margin-bottom:12px;position:relative}
.card.c-teal{border-left-color:var(--teal)}.card.c-yellow{border-left-color:var(--yellow)}.card.c-navy{border-left-color:var(--navy)}
.hbox{background:var(--tint);color:var(--orange-ink);font-weight:700;border-radius:4px;padding:10px 12px;font-size:13px}
.chip-ex{display:inline-flex;align-items:center;gap:4px;background:var(--grey);color:var(--grey-ink);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:3px;white-space:nowrap}
.chip-tier{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--tint);color:var(--orange-ink)}
.badge-tried{display:inline-flex;align-items:center;gap:3px;background:var(--teal-ink);color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;vertical-align:1px}
.pending-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--teal-ink)}
.pending-tag::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--teal);border-right-color:transparent;animation:spin .8s linear infinite}
.ok-tag{font-size:11px;font-weight:600;color:var(--teal-ink)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Buttons ---------- */
.btn{min-height:44px;padding:0 14px;border-radius:4px;font-weight:600;font-size:13px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform var(--fast),background var(--fast),box-shadow var(--fast);line-height:1.15;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.teal{border-color:var(--teal);color:var(--teal-ink)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;font-size:12px;padding:0 10px}
.mini{min-height:44px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.mini.on{background:var(--tint);border-color:var(--orange);color:var(--orange-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:22px;font-size:12.5px;font-weight:500;transition:background var(--fast),border-color var(--fast)}
.chip.on{background:var(--tint);border-color:var(--orange);color:var(--orange-ink);font-weight:600}
.chip.f.on{background:#E3F4F6;border-color:var(--teal);color:var(--teal-ink)}
.input,.ta{width:100%;border:1px solid var(--line);border-radius:4px;background:#fff;padding:10px 12px;min-height:44px}
.ta{min-height:76px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* ---------- Phone ---------- */
.phone{width:390px;height:min(844px, calc(100vh - 112px));height:min(844px, calc(100dvh - 112px));min-height:560px;background:var(--navy);border-radius:48px;padding:11px;box-shadow:0 30px 60px -30px rgba(17,24,39,.45),0 0 0 1px #0b0f19;flex:none}
.screen-wrap{position:relative;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0 30px;font-size:13px;font-weight:600}
.statusbar .icons{display:flex;gap:5px;align-items:center}
.appbar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px 8px;border-bottom:1px solid var(--line);background:var(--cream)}
.appbar .brand{font-weight:700;font-size:16px;color:var(--navy);letter-spacing:-.2px}
.wallet-chip{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;background:var(--navy);color:#fff;border:0;font-size:12px;font-weight:600;transition:transform var(--fast)}
.wallet-chip .dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFD45E,var(--yellow) 55%,#E19B00)}
.wallet-chip.bump{animation:bump .45s var(--ease)}
@keyframes bump{40%{transform:scale(1.12)}}
.modebar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:var(--muted);background:#fff;border-bottom:1px solid var(--line)}
.modebar .seg{margin-left:auto}
.modebar .seg button{min-height:32px;font-size:12px;padding:0 10px}
.modebar .seg button[aria-pressed="true"]{background:var(--teal-ink)}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;overscroll-behavior:contain}
.screen-anim{animation:fadeIn var(--fast) var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#fff;padding:2px 4px 14px}
.tabs button{border:0;background:transparent;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--muted);border-radius:6px}
.tabs button[aria-current="page"]{color:var(--orange-ink);font-weight:700}
.tabs svg{width:22px;height:22px}

/* product */
.prod{display:flex;gap:12px;align-items:flex-start}
.prod .tile{width:84px;height:84px;flex:none}
.prod h2{font-size:16px;margin:0;font-weight:700;line-height:1.25}
.ring-wrap{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted)}
.ring{width:34px;height:34px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--grey)}.ring .fg{stroke:var(--orange);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring-wrap.done .fg{stroke:var(--teal)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px;border-left:4px solid var(--teal)}
.stat:nth-child(2){border-left-color:var(--orange)}
.stat b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.stat > span{font-size:12px;color:var(--muted)}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--orange);margin-right:6px;vertical-align:2px;box-shadow:0 0 0 0 rgba(242,78,35,.5);animation:live 1.8s infinite}
@keyframes live{70%{box-shadow:0 0 0 7px rgba(242,78,35,0)}100%{box-shadow:0 0 0 0 rgba(242,78,35,0)}}
#liveCount{display:inline-block;transition:transform var(--fast)}
#liveCount.tick{transform:translateY(-2px)}
.actions3{display:grid;grid-template-columns:1fr 1.15fr 1.35fr;gap:6px;margin-bottom:16px}
.actions3 .btn{padding:0 6px;font-size:12px}
.sec{margin:20px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h3{font-size:15px;font-weight:700;margin:0}
.counts{font-size:11px;color:var(--muted)}
.tot{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.tot .opt{border:1px solid var(--line);border-radius:4px;padding:10px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.tot .opt .tile{width:54px;height:54px}
.tot .vs{align-self:center;font-weight:700;color:var(--orange)}
.vote-bar{height:8px;background:var(--grey);border-radius:4px;overflow:hidden;width:100%}
.vote-bar i{display:block;height:100%;background:var(--teal)}
.qa{border-top:1px solid var(--line);padding:12px 0}
.qa:first-of-type{border-top:0;padding-top:0}
.qa .q{font-weight:600;font-size:13.5px;margin-bottom:6px}
.qa .a{font-size:13px;margin:6px 0 0;padding-left:10px;border-left:2px solid var(--line)}
.who{font-weight:600;font-size:12px}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-of-type{border-top:0;padding-top:0}
.stars{color:var(--yellow);letter-spacing:1px;font-size:13px}
.rev p{margin:6px 0 8px;font-size:13px}
.rev .row .mini{flex:1;justify-content:center}
.reply-box{margin-top:8px;font-size:12.5px;background:var(--cream);border-radius:4px;padding:8px 10px}
.newmember{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.av0{background:var(--orange)}.av1{background:var(--teal-ink)}.av2{background:#C58A00}.av3{background:var(--navy)}.av4{background:#8A4FBF}
.wa{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#1F9D55;color:#fff;font-size:10px;font-weight:700}

/* sheets */
.backdrop{position:absolute;inset:0;background:rgba(17,24,39,.42);opacity:0;pointer-events:none;transition:opacity var(--fast);z-index:20}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;background:var(--cream);border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform 260ms var(--ease);z-index:21;display:flex;flex-direction:column}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#d6cfc5;margin:8px auto 0}
.sheet .sh-head{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
.sheet .sh-head .title{font-size:18px}
.sheet .close{margin-left:auto;width:44px;height:44px;border:0;background:transparent;font-size:22px;color:var(--muted);border-radius:4px}
.sheet .sh-body{overflow-y:auto;padding:4px 16px 22px}
.person{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person .meta{flex:1;min-width:0;font-size:12.5px}
.person .meta b{font-size:13.5px}
.person .btn{flex:none}
.person-reply{font-size:12.5px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:4px;padding:8px 10px;margin:-2px 0 10px 46px}
.photo-ph{height:92px;border:1.5px dashed var(--line);border-radius:4px;display:grid;place-items:center;color:var(--muted);font-size:12px;background:#fff;width:100%}
.photo-ph.has{border-style:solid;border-color:var(--teal);background:linear-gradient(135deg,#E3F4F6,#fff);color:var(--teal-ink);font-weight:600}

/* toasts + coins */
.toasts{position:absolute;top:96px;left:12px;right:12px;z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:4px;padding:10px 12px;box-shadow:0 10px 24px -12px rgba(17,24,39,.35);font-size:12.5px;animation:toastIn 240ms var(--ease);pointer-events:auto}
.toast b{display:block;font-size:13.5px}
.toast.pending{border-left-color:var(--teal)}.toast.limit{border-left-color:var(--yellow)}.toast.info{border-left-color:var(--navy)}.toast.existing{border-left-color:#A8A39B}
.toast.out{opacity:0;transform:translateY(-6px);transition:all 220ms}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}}
.coin{position:fixed;width:22px;height:22px;border-radius:50%;z-index:100;pointer-events:none;background:radial-gradient(circle at 35% 35%,#FFD45E,var(--yellow) 55%,#E19B00);box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform 720ms cubic-bezier(.5,-.2,.3,1),opacity 720ms}
.coin.o{background:radial-gradient(circle at 35% 35%,#FF8A66,var(--orange) 60%,#C93A12)}

/* highlight pulse */
.hl{outline:3px solid var(--orange)!important;outline-offset:3px;border-radius:4px;animation:hl 1.4s ease-in-out infinite}
@keyframes hl{50%{outline-color:rgba(242,78,35,.25);outline-offset:6px}}

/* trial */
.delivered{display:inline-flex;align-items:center;gap:6px;background:#E3F4F6;color:var(--teal-ink);font-weight:600;font-size:12px;border-radius:3px;padding:4px 9px}
.starpick{display:flex;gap:2px}
.starpick button{width:44px;height:44px;border:0;background:transparent;font-size:26px;color:#D8D2C8;padding:0}
.starpick button.on{color:var(--yellow)}
.slider{margin:10px 0}
.slider label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--orange);min-height:32px}
.locked{text-align:center;padding:28px 16px}
.locked .lock{width:48px;height:48px;border-radius:50%;background:var(--tint);display:grid;place-items:center;margin:0 auto 10px;color:var(--orange)}
.banner{display:flex;gap:8px;align-items:center;background:#fff;border:1px dashed var(--teal);border-radius:4px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;color:var(--teal-ink);font-weight:500}

/* buzz */
.video{position:relative;aspect-ratio:9/14;border-radius:6px;overflow:hidden;background:linear-gradient(160deg,#1c2a44 0%,#111827 55%,#2a1a14 100%);color:#fff;margin-bottom:10px}
.video .tube{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-14deg);width:72px;height:150px}
.video .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--orange)}
.video .play svg{width:28px;height:28px;margin-left:4px}
.video .vmeta{position:absolute;left:12px;right:12px;bottom:14px;font-size:12.5px}
.video .vmeta b{font-size:14px}
.video .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
.video .prog i{display:block;height:100%;width:0;background:var(--orange);transition:width .25s linear}
.vacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}

/* wallet */
.balance{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.balance .card{margin:0}
.balance b{display:block;font-size:34px;line-height:1.05;font-weight:700}
.balance .card:first-child b{color:var(--orange)}
.pbar{height:10px;background:var(--grey);border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--orange);border-radius:5px;transition:width 400ms var(--ease)}
.pbar.teal i{background:var(--teal)}.pbar.yellow i{background:var(--yellow)}
.convert{display:flex;align-items:center;justify-content:center;gap:10px;height:64px;font-weight:700}
.convert .c{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;background:radial-gradient(circle at 35% 35%,#FF8A66,var(--orange) 60%,#C93A12)}
.convert .c.y{background:radial-gradient(circle at 35% 35%,#FFD45E,var(--yellow) 55%,#E19B00);color:var(--navy);width:44px;height:44px;font-size:12px}
.convert .arrow{color:var(--muted)}
.convert.play .c.b1{animation:merge1 1.1s var(--ease)}
.convert.play .c.b2{animation:merge2 1.1s var(--ease)}
.convert.play .c.y{animation:pop 1.1s var(--ease)}
@keyframes merge1{0%{transform:none}45%{transform:translateX(22px) scale(.8);opacity:.6}60%{transform:translateX(70px) scale(.4);opacity:0}61%{transform:none;opacity:0}100%{opacity:1}}
@keyframes merge2{0%{transform:none}45%{transform:translateX(-0px) scale(.8);opacity:.6}60%{transform:translateX(46px) scale(.4);opacity:0}61%{transform:none;opacity:0}100%{opacity:1}}
@keyframes pop{0%,55%{transform:scale(.6);opacity:.4}75%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
.hist li:first-child{border-top:0}
.hist .n{font-weight:700;text-align:right;min-width:44px}
.hist .n.bits{color:var(--orange-ink)}
.capline{display:grid;grid-template-columns:1fr 92px 38px;gap:8px;align-items:center;font-size:12px;padding:5px 0}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.kv:first-child{border-top:0}

/* ---------- Dashboards ---------- */
.dash{width:100%;max-width:1000px;padding:4px 4px 40px;animation:fadeIn var(--fast) var(--ease)}
.dash .title{font-size:30px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:110px 1fr 84px;gap:10px;align-items:center;font-size:13px}
.frow .track{height:22px;background:var(--grey);border-radius:3px;overflow:hidden}
.frow .track i{display:block;height:100%;background:var(--navy);transition:width 400ms var(--ease)}
.frow.obsa .track i{background:var(--orange)}
.frow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.live-delta{display:inline-block;margin-left:4px;font-size:10px;font-weight:700;color:var(--teal-ink)}

<script>
(function(){
"use strict";

/* ================= Reward rules ================= */
const TIERS = {
  Light:  { bits: 1, cap: 10 },
  Medium: { bits: 3, cap: 10 },
  Heavy:  { bits: 8, cap: 5 }
};
const MONTHLY_CAP = 150;
const PENDING_MS = 2000;

// id: [label, tier, counts-when, options]
const A = {};
function def(id, group, label, tier, when, o){ A[id] = Object.assign({ id, group, label, tier, when, bits: TIERS[tier].bits, cap: TIERS[tier].cap, payout: "bits" }, o || {}); }
def("view","Discover and decide","Verified product view","Light","20+ seconds on page and scrolled to reviews",{cap:5, stage:"noticed"});
def("ask","Discover and decide","Asked a question","Medium","question approved",{pending:true, stage:"discussed"});
def("answer","Discover and decide","Answered a question","Medium","answer approved (verified triers only)",{pending:true, trier:true, stage:"discussed"});
def("doubt","Discover and decide","Tapped a doubt","Light","one tap per product",{stage:"hesitated"});
def("compare","Discover and decide","Compared two products","Light","you have tried at least one",{trier:true, lockMsg:"Counts when you've tried at least one of these", stage:"considered"});
def("helpful","Discover and decide","Marked a review helpful","Light","once per review",{stage:"considered"});
def("same","Discover and decide","Same concern on a review","Light","once per review",{stage:"hesitated"});
def("share","Discover and decide","Shared on WhatsApp","Medium","a friend opens the link",{pending:true, stage:"shared"});
def("bring","Discover and decide","Voted: bring it to trial","Light","one vote per product",{stage:"considered"});
def("hi","Connect","Said hi","Medium","the other person replies",{pending:true, stage:"discussed"});
def("welcome","Connect","Welcomed a new member","Medium","the new member replies",{pending:true, stage:"discussed"});
def("replyReview","Connect","Replied to a review","Medium","the poster replies or your reply is marked helpful",{pending:true, stage:"discussed"});
def("day1","After trial","Day-1 first impression","Medium","within 24h of delivery",{trier:true, stage:"used"});
def("fullsize","After trial","Full-size intent","Light","one tap per product",{trier:true, stage:"considered"});
def("attrs","After trial","Attribute ratings","Light","after your star rating, once per product",{trier:true, stage:"used"});
def("day14","After trial","Day-14 follow-up review","Heavy","Day 14 after delivery",{trier:true, payout:"trial", stage:"used"});
def("photoReview","After trial","Photo review","Heavy","photo passes moderation",{pending:true, trier:true, stage:"used"});
def("recommend","After trial","Recommended to a friend","Medium","friend opens the link",{pending:true, trier:true, stage:"recommended"});
def("prompt","Buyers' Circle","Answered a Smytten prompt","Medium","you're a verified buyer",{trier:true, stage:"recommended"});
def("convo","Buyers' Circle","Started a conversation","Medium","another buyer replies",{pending:true, trier:true, stage:"discussed"});
def("replyBuyer","Buyers' Circle","Replied to another buyer","Medium","you're a verified buyer",{trier:true, stage:"discussed"});
def("tip","Buyers' Circle","Shared a tip with a photo","Heavy","photo passes moderation",{pending:true, trier:true, stage:"recommended"});
def("saveVideo","Buzz Hub","Saved a video","Light","you watched most of the video",{stage:"considered"});
def("helpfulVideo","Buzz Hub","Marked a video helpful","Light","you watched most of the video",{stage:"considered"});
def("askVideo","Buzz Hub","Asked under a video","Medium","question approved",{pending:true, stage:"discussed"});
def("purchase","Purchase","Shared link led to a full-size purchase","Heavy","order delivered",{pending:true, payout:"cashbuck", stage:"bought"});

const EXISTING = [
  { label:"Comments", reward:"Smytten's current payout" },
  { label:"Written reviews", reward:"Smytten's current payout" },
  { label:"Buzz Hub videos", reward:"Smytten's current payout" },
  { label:"Buzz Hub reply videos", reward:"50 Bucks" }
];

/* ================= Mock data ================= */
const PEOPLE = [
  { id:"aanya", name:"Aanya", skin:"oily skin", status:"trying it for 2 weeks", reply:"Hi! It's been really good on my T-zone, and it doesn't leave my skin tight." },
  { id:"kabir", name:"Kabir", skin:"combination skin", status:"comparing it with a gel cleanser", reply:"Hey! Feels gentler than my gel one. Cheeks stay comfortable." },
  { id:"ishita", name:"Ishita", skin:"sensitive skin", status:"checking if it's fragrance-free", reply:"Hi! I couldn't smell anything, and no redness after 10 days." },
  { id:"rohan", name:"Rohan", skin:"oily skin", status:"bought the full size last month", reply:"Hey! Went for the full size after the trial. Fewer breakouts on my chin." },
  { id:"zoya", name:"Zoya", skin:"dry skin", status:"just browsing", reply:"Hi! I'm deciding too. Worried it'll be drying for me." }
];
const DOUBTS = [
  { t:"Too oily?", base:412 }, { t:"Strong fragrance?", base:268 }, { t:"Worth the price?", base:351 }, { t:"OK for sensitive skin?", base:497 }
];
const FILTERS = ["Oily skin","Dry skin","Combination","18–24","25–34"];
const BASE_FUNNEL = [
  ["Noticed","noticed",12480,false],["Considered","considered",6210,false],["Discussed","discussed",1940,true],
  ["Shared","shared",820,true],["Hesitated","hesitated",2360,true],["Bought","bought",1120,false],
  ["Used","used",980,false],["Recommended","recommended",410,true],["Repeated","repeated",260,false]
];

function seed(){
  return {
    view:"app", screen:"product", mode:"shopper", step:0, panelOpen:false, sheet:null,
    bits:0, monthBits:0, existingBucks:0, trialPoints:0, cashbuck:0,
    daily:{}, once:{}, history:[], stageDelta:{},
    viewers:37, viewTime:0, reachedReviews:false, viewDone:false,
    doubtTaps:[0,0,0,0], doubtPicked:-1,
    tot:{ picked:null, a:58, b:42 },
    bring:false,
    filters:[],
    questions:[
      { id:"q1", text:"Does it help with blackheads?", count:312, answers:[{ who:"Sana", tried:true, text:"Slowly, yes. My nose looked clearer after about two weeks." }] },
      { id:"q2", text:"Is it OK to use twice a day?", count:248, answers:[{ who:"Arjun", tried:true, text:"I use it morning and night. No dryness on my oily skin." },{ who:"Meha", tried:false, text:"I think the pack says twice daily." }] },
      { id:"q3", text:"Will it make my skin purge?", count:191, answers:[] }
    ],
    reviews:[
      { id:"r1", who:"Sana", skin:"Oily skin", age:"18–24", stars:5, text:"Cleared my small breakouts in about 10 days. Slight tingle the first two days.", helpful:214, same:38 },
      { id:"r2", who:"Tanvi", skin:"Combination", age:"25–34", stars:4, text:"Great on my T-zone, a little drying on the cheeks in winter.", helpful:156, same:61 },
      { id:"r3", who:"Neha", skin:"Dry skin", age:"25–34", stars:3, text:"Too drying on its own for me. Works if I moisturise right after.", helpful:98, same:44 },
      { id:"r4", who:"Arjun", skin:"Oily skin", age:"25–34", stars:4, text:"Foams lightly, no strong smell. The 5 ml trial lasted me 9 days.", helpful:77, same:12 }
    ],
    replies:{},           // reviewId -> {text, status}
    people:{},            // personId -> "pending" | "replied"
    welcome:null,
    share:null, purchase:null,
    circlePrompt:[{ who:"Arjun", text:"It's a no-fuss cleanser. Start once a day if your skin is on the dry side." }],
    threads:[
      { id:"t1", who:"Tanvi", text:"Week 2 update: fewer breakouts on my chin, but I need moisturiser after. Anyone else?", replies:[{ who:"Arjun", text:"Same here. A gel moisturiser right after fixes it." }] },
      { id:"t2", who:"Rohan", text:"Morning or night: when do you use it?", replies:[{ who:"Sana", text:"Night only, and sunscreen in the morning." }] },
      { id:"t3", who:"Ishita", text:"Sensitive skin check-in: no stinging after 10 days.", replies:[] }
    ],
    myConvo:null, tips:[],
    trial:{ day:1, impression:null, intent:null, stars:0, attrs:{ Texture:4, Fragrance:3, Results:4 }, attrsSent:false, day14:null, photo:null, recommend:null, review:false },
    buzz:{ progress:0, playing:false, saved:false, helpful:false, questions:[], replyVideo:false, comments:[] },
    convertKick:false
  };
}
let S = seed();
let timers = [];
function later(fn, ms){ const t = setTimeout(fn, ms); timers.push(t); return t; }

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const num = n => Number(n).toLocaleString("en-IN");
function fb(n){ // Bucks with halves
  if (n === 0.5) return "½";
  if (n % 1) return (Math.floor(n) ? Math.floor(n) : "") + "½";
  return num(n);
}
const bucks = () => Math.floor(S.bits / 2) + S.existingBucks;
const nowT = () => new Date().toLocaleTimeString("en-IN", { hour:"2-digit", minute:"2-digit" });
function tile(color, size){
  const c = color || "#17A2B0";
  return `<svg class="tile" viewBox="0 0 80 80" width="${size||84}" height="${size||84}" aria-hidden="true"><rect width="80" height="80" rx="4" fill="${c}"/><g transform="rotate(-18 40 40)"><rect x="29" y="12" width="22" height="44" rx="5" fill="#fff"/><rect x="33" y="56" width="14" height="11" rx="2" fill="#fff" opacity=".85"/><rect x="33" y="24" width="14" height="3" rx="1.5" fill="${c}" opacity=".55"/><rect x="33" y="30" width="9" height="2.5" rx="1.25" fill="${c}" opacity=".35"/></g></svg>`;
}
function av(name, i){ return `<span class="avatar av${i % 5}" aria-hidden="true">${esc(name[0])}</span>`; }
const starStr = n => "★".repeat(n) + "☆".repeat(5 - n);
const exTag = (t) => `<span class="chip-ex">${t || "Existing reward, unchanged"}</span>`;
function tierTag(id){ const a = A[id]; return `<span class="chip-tier">+${a.bits} Bit${a.bits>1?"s":""}</span>`; }

/* ================= Toasts & coins ================= */
function toast(kind, title, sub){
  const box = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = `<b>${esc(title)}</b>${sub ? `<span class="muted">${esc(sub)}</span>` : ""}`;
  box.prepend(el);
  while (box.children.length > 3) box.lastChild.remove();
  el.dismiss = () => { el.classList.add("out"); setTimeout(() => el.remove(), 240); };
  setTimeout(el.dismiss, kind === "pending" ? 6000 : 3200);
  return el;
}
function coins(from){
  const chip = $("#walletChip");
  if (!chip || S.view !== "app") return;
  const to = chip.getBoundingClientRect();
  if (!to.width) return;
  const f = from && from.width ? from : $("#toasts").getBoundingClientRect();
  const sx = f.left + f.width / 2 - 11, sy = f.top + Math.min(f.height, 60) / 2 - 11;
  ["o",""].forEach((cls, i) => {
    const c = document.createElement("div");
    c.className = "coin " + cls;
    c.style.left = sx + "px"; c.style.top = sy + "px";
    document.body.appendChild(c);
    setTimeout(() => {
      c.style.transform = `translate(${to.left + 14 - sx}px, ${to.top + to.height / 2 - 11 - sy}px) scale(.55)`;
      c.style.opacity = ".2";
    }, 30 + i * 130);
    setTimeout(() => { c.remove(); chip.classList.remove("bump"); void chip.offsetWidth; chip.classList.add("bump"); }, 800 + i * 130);
  });
}

/* ================= Award engine ================= */
// Returns true when the action was accepted (awarded now, or pending its condition).
function act(id, o){
  o = o || {};
  const a = A[id];
  if (a.trier && S.mode !== "trier"){
    toast("info", a.lockMsg || "Verified triers only", "Switch “View as” to Verified trier to try this.");
    return false;
  }
  if (o.key && S.once[o.key]){
    toast("info", "Already counted", `${a.label}: Bits count ${a.when}.`);
    return false;
  }
  const used = S.daily[id] || 0;
  if (used >= a.cap){
    toast("limit", "Daily limit reached for this action", `${a.label} · ${a.cap} per day`);
    return false;
  }
  S.daily[id] = used + 1;
  if (o.key) S.once[o.key] = true;
  const from = o.el ? o.el.getBoundingClientRect() : null;
  if (a.pending){
    const pt = toast("pending", "Pending · " + a.label, "Counts when: " + a.when);
    if (o.onPending) o.onPending();
    render();
    later(() => {
      pt.dismiss();
      if (o.onResolve) o.onResolve();
      award(id, o.resolved, null);
    }, PENDING_MS);
    return true;
  }
  if (o.onResolve) o.onResolve();
  award(id, null, from);
  return true;
}
function award(id, resolvedMsg, from){
  const a = A[id];
  const room = MONTHLY_CAP - S.monthBits;
  if (room <= 0){
    toast("limit", "Monthly limit reached", "150 Smytten Bits per month. " + a.label + " still recorded.");
    render(); return;
  }
  const give = Math.min(a.bits, room);
  const before = bucks();
  S.monthBits += give;
  let sub;
  if (a.payout === "trial"){ S.trialPoints += give; sub = "Paid as Trial points, at a rate agreed with Smytten"; }
  else if (a.payout === "cashbuck"){ S.cashbuck += give / 2; sub = `${inr(give/2)} Cashbuck added to your wallet`; }
  else { S.bits += give; sub = `= ${fb(give/2)} Smytten Buck${give/2 > 1 ? "s" : ""}`; }
  S.history.unshift({ label:a.label, bits:give, payout:a.payout, time:nowT(), id });
  if (a.stage) S.stageDelta[a.stage] = (S.stageDelta[a.stage] || 0) + 1;
  toast("award", `+${give} Smytten Bit${give>1?"s":""} · ${a.label}`, resolvedMsg ? resolvedMsg + " · " + sub : sub);
  if (give < a.bits) toast("limit", "Monthly limit reached", "You hit 150 Bits this month.");
  if (bucks() > before) S.convertKick = true;
  render();
  coins(from);
}
function existing(label, bucksPaid, el){
  S.history.unshift({ label, bits:0, payout:"existing", bucks:bucksPaid || 0, time:nowT() });
  if (bucksPaid) S.existingBucks += bucksPaid;
  toast("existing", "Existing reward, unchanged · " + label, bucksPaid ? `${bucksPaid} Bucks at Smytten's current payout. OBSA earns nothing on this.` : "Paid at Smytten's current rate. OBSA earns nothing on this.");
  render();
  if (bucksPaid) coins(el ? el.getBoundingClientRect() : null);
}

let hlSel = null;
function goStep(i, scroll){
  S.step = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[S.step], g = s.go;
  if (g.mode) S.mode = g.mode;
  S.view = g.view;
  if (g.screen) S.screen = g.screen;
  S.sheet = g.sheet ? Object.assign({}, g.sheet) : null;
  hlSel = s.target;
  render(true);
  if (scroll !== false){
    requestAnimationFrame(() => {
      const el = document.querySelector(s.target);
      if (!el) return;
      const box = el.closest("#sheet") ? el.closest(".sh-body") : el.closest("#scroller") || $("#stage");
      if (s.top){ box.scrollTop = 0; return; }
      const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
      box.scrollTo({ top: box.scrollTop + r.top - b.top - b.height / 2 + r.height / 2, behavior:"smooth" });
    });
  }
  if (s.convert) later(kickConvert, 450);
}

/* ================= Render ================= */
function render(screenChanged){
  // view switch
  document.querySelectorAll('[data-a="view"]').forEach(b => { if (b.closest(".seg")) b.setAttribute("aria-pressed", b.dataset.v === S.view); });
  $("#phone").hidden = S.view !== "app";
  const dash = $("#dash");
  dash.hidden = S.view === "app";
  if (S.view === "insights") dash.innerHTML = dashInsights();
  if (S.view === "econ"){
    const keep = $("#cUsers") ? [$("#cUsers").value, $("#cBits").value] : null;
    const prevTop = $("#stage").scrollTop;
    dash.innerHTML = dashEcon();
    if (keep){ $("#cUsers").value = keep[0]; $("#cBits").value = keep[1]; $("#stage").scrollTop = prevTop; }
    updateCalc();
  }

  // phone chrome
  $("#chipText").textContent = `Bits ${S.bits} · Bucks ${num(bucks())}`;
  document.querySelectorAll('[data-a="mode"]').forEach(b => { if (b.closest(".seg")) b.setAttribute("aria-pressed", b.dataset.m === S.mode); });
  $("#tabs").innerHTML = TABS.map(([id, label, ico]) => `<button data-a="tab" data-s="${id}" ${S.screen === id ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ico}</svg>${label}</button>`).join("");

  // keep inputs + focus across re-render
  const kept = {};
  document.querySelectorAll("#screen [data-keep], #sheet [data-keep]").forEach(el => { kept[el.id] = el.value; });
  const fid = document.activeElement && document.activeElement.id;
  const sc = $("#scroller"), top = sc.scrollTop;
  const fn = { product:screenProduct, circle:screenCircle, trial:screenTrial, buzz:screenBuzz, wallet:screenWallet }[S.screen];
  $("#screen").innerHTML = fn();
  $("#screen").className = screenChanged ? "screen-anim" : "";
  const sheet = $("#sheet");
  const wasOpen = sheet.classList.contains("show");
  if (S.sheet){ sheet.innerHTML = sheetHtml(); sheet.classList.add("show"); $("#backdrop").classList.add("show"); }
  else { sheet.classList.remove("show"); $("#backdrop").classList.remove("show"); }
  Object.keys(kept).forEach(id => { const el = document.getElementById(id); if (el) el.value = kept[id]; });
  if (screenChanged) sc.scrollTop = 0; else sc.scrollTop = top;
  if (fid){ const f = document.getElementById(fid); if (f && f !== document.body) f.focus({ preventScroll:true }); }
  if (S.sheet && !wasOpen) setTimeout(() => { const c = sheet.querySelector("textarea, .btn"); if (c && !hlSel) c.focus({ preventScroll:true }); }, 60);

  // highlight
  document.querySelectorAll(".hl").forEach(e => e.classList.remove("hl"));
  if (hlSel){ const h = document.querySelector(hlSel); if (h) h.classList.add("hl"); }

  updateRing();
  if (S.screen === "wallet" && S.convertKick && S.view === "app"){ S.convertKick = false; setTimeout(kickConvert, 60); }
  renderPanel();
}
function kickConvert(){ const c = $("#convert"); if (!c) return; c.classList.remove("play"); void c.offsetWidth; c.classList.add("play"); }

/* ================= Verified view ================= */
function updateRing(){
  const fg = $("#ringFg"), txt = $("#ringText");
  if (!fg) return;
  const p = S.viewDone ? 1 : Math.min(1, S.viewTime / 20) * (S.reachedReviews ? 1 : .9);
  fg.setAttribute("stroke-dashoffset", (100.5 * (1 - p)).toFixed(1));
  txt.innerHTML = S.viewDone ? `<b style="color:var(--teal-ink)">✓ Verified view</b> · +1 Smytten Bit` :
    `<b>Verified view</b> · ${Math.min(20, S.viewTime)}s / 20s · ${S.reachedReviews ? "✓ reviews seen" : "scroll to reviews"}`;
}
function checkReviews(){
  if (S.screen !== "product" || S.reachedReviews) return;
  const h = $("#reviewsHead"), sc = $("#scroller");
  if (!h) return;
  if (h.getBoundingClientRect().top < sc.getBoundingClientRect().bottom - 60){ S.reachedReviews = true; updateRing(); maybeView(); }
}
function maybeView(){
  if (S.viewDone || S.viewTime < 20 || !S.reachedReviews) return;
  S.viewDone = true;
  act("view", { key:"view:p1", el:$("#ringWrap") });
}
setInterval(() => {
  if (S.view === "app" && S.screen === "product" && !S.viewDone && !document.hidden){ S.viewTime++; updateRing(); maybeView(); }
}, 1000);
setInterval(() => {
  S.viewers = Math.max(31, Math.min(44, S.viewers + [-2,-1,1,1,2][Math.floor(Math.random() * 5)]));
  const el = $("#liveCount");
  if (el){ el.textContent = S.viewers; el.classList.add("tick"); setTimeout(() => el.classList.remove("tick"), 220); }
}, 3500);
$("#scroller").addEventListener("scroll", checkReviews, { passive:true });
// Overflow-hidden frames must never scroll (focus or scrollIntoView can nudge them).
[".screen-wrap", "#presenter", ".layout"].forEach(sel => { const el = $(sel); el.addEventListener("scroll", () => { el.scrollTop = 0; el.scrollLeft = 0; }); });
window.addEventListener("scroll", () => { if (window.scrollY) window.scrollTo(0, 0); });

/* ================= Handlers ================= */
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ""; };
const H = {
  view(t){ S.view = t.dataset.v; hlSel = null; render(true); $("#stage").scrollTop = 0; },
  tab(t){ S.screen = t.dataset.s; S.sheet = null; hlSel = null; S.view = "app"; render(true); setTimeout(checkReviews, 50); },
  mode(t){ S.mode = t.dataset.m; render(); toast("info", S.mode === "trier" ? "Viewing as a verified trier" : "Viewing as a shopper", S.mode === "trier" ? "Answering, Buyers' Circle posting and after-trial actions are unlocked." : "Trier-only actions are locked."); },
  sheet(t){ S.sheet = { t:t.dataset.t }; hlSel = null; render(); },
  "sheet-close"(){ S.sheet = null; render(); },
  "convo-start"(){
    S.screen = "circle";
    if (S.mode === "trier") S.sheet = { t:"convo" };
    else toast("info", "Buyers' Circle", "Everyone can read. Only verified buyers can start a conversation.");
    render(true);
  },
  doubt(t){
    const i = +t.dataset.i;
    if (S.doubtPicked >= 0){ toast("info", "Already counted", "Tap a doubt counts one tap per product."); return; }
    S.doubtPicked = i; S.doubtTaps[i]++;
    act("doubt", { key:"doubt:p1", el:t });
  },
  compare(t){
    const side = t.dataset.side;
    act("compare", { key:"compare:p1", el:t, onResolve(){ S.tot.picked = side; if (side === "a") S.tot.a++; else S.tot.b++; const tot = S.tot.a + S.tot.b; S.tot.a = Math.round(S.tot.a / tot * 100); S.tot.b = 100 - S.tot.a; } });
  },
  helpful(t){ act("helpful", { key:"helpful:" + t.dataset.r, el:t }) || render(); },
  same(t){ act("same", { key:"same:" + t.dataset.r, el:t }) || render(); },
  filter(t){ const f = t.dataset.f; S.filters = S.filters.includes(f) ? S.filters.filter(x => x !== f) : S.filters.concat(f); render(); },
  "reply-open"(t){ if (S.replies[t.dataset.r]){ toast("info","Already replied","One reply per review counts."); return; } S.sheet = { t:"reply", r:t.dataset.r }; render(); },
  reply(t){
    const r = S.reviews.find(x => x.id === t.dataset.r), text = val("repIn") || "Thanks for sharing!";
    act("replyReview", { key:"reply:" + r.id, onPending(){ S.replies[r.id] = { text, status:"pending" }; S.sheet = null; },
      onResolve(){ S.replies[r.id].status = "done"; S.replies[r.id].back = "Yes! Gone by day 4. Go slow at first."; }, resolved: r.who + " replied" });
  },
  share(t){
    act("share", { key:"share:p1", onPending(){ S.share = "pending"; }, onResolve(){ S.share = "opened"; }, resolved:"Priya opened your link" });
  },
  purchase(){
    act("purchase", { key:"purchase:p1", onPending(){ S.purchase = "pending"; }, onResolve(){ S.purchase = "done"; }, resolved:"Order delivered" });
  },
  bring(t){ act("bring", { key:"bring:p2", el:t, onResolve(){ S.bring = true; } }); },
  welcome(){ act("welcome", { key:"welcome:meera", onPending(){ S.welcome = "pending"; }, onResolve(){ S.welcome = "replied"; }, resolved:"Meera replied" }); },
  hi(t){
    const p = PEOPLE.find(x => x.id === t.dataset.p);
    if (hlSel === "#hi-" + p.id) hlSel = null;
    act("hi", { key:"hi:" + p.id, onPending(){ S.people[p.id] = "pending"; }, onResolve(){ S.people[p.id] = "replied"; }, resolved:p.name + " replied" });
  },
  ask(){
    const text = val("askIn");
    if (!text){ toast("info","Type a question first",""); return; }
    const q = { id:"q" + Date.now(), text, mine:true, status:"pending", answers:[], count:1 };
    act("ask", { onPending(){ S.questions.unshift(q); S.sheet = null; if (hlSel === "#askBtn") hlSel = null; }, onResolve(){ q.status = "approved"; }, resolved:"Question approved" });
  },
  "answer-open"(t){ S.sheet = { t:"answer", q:t.dataset.q }; render(); },
  answer(t){
    const q = S.questions.find(x => x.id === t.dataset.q), text = val("ansIn") || "It worked well for me.";
    const ans = { who:"You", tried:true, text, status:"pending" };
    act("answer", { key:"answer:" + q.id, onPending(){ q.answers.push(ans); q.answered = true; S.sheet = null; }, onResolve(){ ans.status = "ok"; }, resolved:"Answer approved" });
  },
  "convo"(){
    const text = val("convoIn") || "How's it working for you?";
    act("convo", { onPending(){ S.myConvo = { text, status:"pending" }; S.sheet = null; }, onResolve(){ S.myConvo.status = "done"; }, resolved:"Rohan replied" });
  },
  "tip-photo"(){ S.sheet.photo = !S.sheet.photo; render(); },
  tip(){
    if (S.mode !== "trier"){ act("tip"); return; }
    if (!S.sheet.photo){ toast("info", "Add a photo first", "Tips with a photo count as Heavy actions."); const b = $('[data-a="tip-photo"]'); if (b) b.focus(); return; }
    const t = { text: val("tipIn") || "My routine", status:"pending" };
    act("tip", { onPending(){ S.tips.unshift(t); S.sheet = null; if (hlSel === "#tipBtn") hlSel = null; }, onResolve(){ t.status = "done"; }, resolved:"Photo passed moderation" });
  },
  prompt(t){
    const text = val("promptIn");
    if (S.mode === "trier" && !text){ toast("info","Write your answer first",""); return; }
    act("prompt", { key:"prompt", el:t, onResolve(){ S.circlePrompt.push({ who:"You", text, mine:true }); } });
  },
  "thread-reply"(t){
    const th = S.threads.find(x => x.id === t.dataset.t), text = val("tin-" + th.id);
    if (S.mode === "trier" && !text){ toast("info","Write a reply first",""); return; }
    act("replyBuyer", { el:t, onResolve(){ th.replies.push({ who:"You", text }); const i = document.getElementById("tin-" + th.id); if (i) i.value = ""; } });
  },
  day1(t){ const text = val("day1In") || "Feels light."; act("day1", { key:"day1:p1", el:t, onResolve(){ S.trial.impression = text; } }); },
  fullsize(t){ const v = t.dataset.v; act("fullsize", { key:"fullsize:p1", el:t, onResolve(){ S.trial.intent = v; } }); },
  star(t){ if (S.trial.attrsSent) return; S.trial.stars = +t.dataset.n; render(); },
  attrs(t){ act("attrs", { key:"attrs:p1", el:t, onResolve(){ S.trial.attrsSent = true; } }); },
  "written-review"(t){ S.trial.review = true; existing("Written review", 0, t); },
  "photo-review"(){ act("photoReview", { key:"photo:p1", onPending(){ S.trial.photo = "pending"; }, onResolve(){ S.trial.photo = "done"; }, resolved:"Photo passed moderation" }); },
  recommend(){ const sk = val("recSkin"); act("recommend", { key:"rec:p1", onPending(){ S.trial.recommend = "pending"; }, onResolve(){ S.trial.recommend = "done"; }, resolved:"Kavya (" + sk + ") opened your link" }); },
  ff14(){ S.trial.day = 14; render(); toast("info", "Fast-forwarded to Day 14", "Day-14 follow-up is now open."); },
  day14(t){ const text = val("day14In") || "Two weeks in."; act("day14", { key:"day14:p1", el:t, onResolve(){ S.trial.day14 = text; } }); },
  play(){
    const b = S.buzz; if (b.playing) return;
    b.playing = true; render();
    const iv = setInterval(() => {
      b.progress = Math.min(100, b.progress + 5);
      const p = $("#vprog"); if (p) p.style.width = b.progress + "%";
      if (b.progress >= 85){ clearInterval(iv); b.playing = false; render(); }
    }, 160);
    timers.push(iv);
  },
  "save-video"(t){
    if (S.buzz.progress < 75){ toast("pending", "Not counted yet", "Counts when: you've watched most of the video"); return; }
    act("saveVideo", { key:"save:v1", el:t, onResolve(){ S.buzz.saved = true; } });
  },
  "helpful-video"(t){
    if (S.buzz.progress < 75){ toast("pending", "Not counted yet", "Counts when: you've watched most of the video"); return; }
    act("helpfulVideo", { key:"helpful:v1", el:t, onResolve(){ S.buzz.helpful = true; } });
  },
  "ask-video"(){
    const text = val("vqIn"); if (!text){ toast("info","Type a question first",""); return; }
    const q = { text, status:"pending" };
    act("askVideo", { onPending(){ S.buzz.questions.push(q); const i = $("#vqIn"); if (i) i.value = ""; }, onResolve(){ q.status = "ok"; }, resolved:"Question approved" });
  },
  "reply-video"(t){ S.buzz.replyVideo = true; existing("Buzz Hub reply video", 50, t); },
  comment(t){ const c = val("vcIn"); if (!c){ toast("info","Type a comment first",""); return; } S.buzz.comments.push(c); $("#vcIn").value = ""; existing("Comment", 0, t); },
  step(t){ goStep(+t.dataset.n); },
  next(){ if (S.step < STEPS.length - 1) goStep(S.step + 1); else { hlSel = null; render(); toast("info","Walkthrough complete","Open Smytten economics, or Reset demo to run it again."); } },
  prev(){ goStep(S.step - 1); },
  reset(){
    timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = [];
    $("#toasts").innerHTML = "";
    const open = S.panelOpen;
    S = seed(); S.panelOpen = open;
    goStep(0);
    toast("info", "Demo reset", "All Bits and state cleared.");
  },
  "panel-toggle"(t){ S.panelOpen = !S.panelOpen; $("#presenter").classList.toggle("open", S.panelOpen); t.setAttribute("aria-expanded", S.panelOpen); }
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (!t || t.disabled) return;
  const h = H[t.dataset.a];
  if (h){ e.preventDefault(); h(t, e); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.in === "attr"){ S.trial.attrs[t.dataset.k] = +t.value; const l = t.previousElementSibling; if (l) l.lastElementChild.textContent = t.value + " / 5"; }
  if (t.dataset.in === "calc") updateCalc();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.sheet){ S.sheet = null; render(); }
  if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.id){
    const btn = e.target.parentElement && e.target.parentElement.querySelector("[data-a]");
    if (btn){ e.preventDefault(); btn.click(); }
  }
});

goStep(0, false);
})();
</script>
</body>
</html>
